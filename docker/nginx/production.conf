# Traefik terminates TLS and forwards plain HTTP into this container.
map $http_x_forwarded_proto $forwarded_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    root /var/www/public;
    index index.php;

    # one berita request carries a 2 MB cover plus up to 3 gallery photos of 8 MB
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite emits content-hashed filenames, safe to cache forever
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $forwarded_https;
        internal;
    }

    # no other .php file under public/ is ever executed
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
